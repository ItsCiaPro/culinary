<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Culinary - Dashboard</title>
    <!-- Referência ao CSS Normal -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3>Culinary</h3>
            </div>
            <ul class="list-unstyled components">
                <li class="active"><a href="#">Início</a></li>
                <li><a href="#">Receitas</a></li>
                <li><a href="#">Ingredientes</a></li>
                <li><a href="#">Configurações</a></li>
            </ul>
        </nav>

        <!-- Conteúdo Principal -->
        <div id="content">
            <!-- Navbar do Topo -->
            <nav class="navbar">
                <button type="button" id="sidebarCollapse" class="btn">
                    <span>☰ Menu</span>
                </button>
                <div class="user-profile">
                    <span>Bem-vindo, Chef</span>
                </div>
            </nav>
            
            <main>
                <h1>Dashboard</h1>
                <p>O layout em Django foi convertido para uma estrutura estática padrão (Vanilla HTML/CSS/JS).</p>
                <p>Você pode abrir o arquivo <code>index.html</code> diretamente no navegador, sem precisar de um servidor Python rodando.</p>
            </main>
        </div>
    </div>

    <!-- Referência ao JS Normal -->
    <script src="js/script.js"></script>
</body>
</html>
