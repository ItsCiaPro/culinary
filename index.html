<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Culinary | início</title>
    <!-- Referência ao CSS Normal -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3>Culinary</h3>
            </div>
            <ul class="list-unstyled components">
                <li class="active"><a href="#">Início</a></li>
                <li><a href="#">Receitas</a></li>
                <li><a href="#">Videos</a></li>
                <li><a href="#">Postar</a></li>
                <li><a href="#">Despensa</a></li>
                <li><a href="#">Compras</a></li>
            </ul>
        </nav>

        <!-- Conteúdo Principal -->
        <div id="content">
            <!-- Navbar do Topo -->
            <nav class="navbar">
                <button type="button" id="sidebarCollapse" class="btn">
                    <span>☰</span>
                </button>

                <div class="search-bar-container">
                    <!-- Ícone de lupa -->
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>

                    <!-- Campo de pesquisa -->
                    <input type="search" class="search-input" placeholder="Pesquise sua próxima receita"
                        aria-label="Pesquisar receitas">
                </div>
            </nav>

            <main>
                <h1>Dashboard</h1>
                <p>O layout em Django foi convertido para uma estrutura estática padrão (Vanilla HTML/CSS/JS).</p>
                <p>Você pode abrir o arquivo <code>index.html</code> diretamente no navegador, sem precisar de um
                    servidor Python rodando.</p>
            </main>
        </div>
    </div>

    <!-- Referência ao JS Normal -->
    <script src="js/script.js"></script>
</body>

</html>
