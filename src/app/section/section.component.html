<section class="section">
  <div class="section-head">
    <h2>{{ title }}</h2>
    <a routerLink="/receitas">Ver todas <app-icon name="arrow-right"></app-icon></a>
  </div>
  <div class="recipe-grid">
    @for (r of recipes; track r.id) {
      <a class="recipe-card" [routerLink]="['/receita', r.id]"
        ><img [src]="imageUrl(r)" [alt]="r.name" />
        <div class="recipe-info">
          @if (r.rating) {
            <span class="rating"><app-icon name="star"></app-icon> {{ r.rating }}</span>
          } @else {
            <span class="rating">Nova receita</span>
          }
          <h3>{{ r.name }}</h3>
          <p>
            <app-icon name="clock"></app-icon> {{ r.minutes }} min ·
            <app-icon name="servings"></app-icon> {{ r.servings }} porções
          </p>
        </div></a
      >
    } @empty {
      <p class="empty">
        Nenhuma receita por aqui. Adicione ingredientes à sua despensa.
      </p>
    }
  </div>
</section>
