<h1 class="page-title">Lista de compras</h1>
<p class="muted">Marque como comprado e o item vai direto pra sua despensa.</p>
<div class="soft shopping-list">
  @for (i of pantry.shopping(); track i) {
    <div class="shopping-row">
      <button class="buy" (click)="pantry.buy(i)" [attr.aria-label]="'Marcar ' + i + ' como comprado'">
        <app-icon name="check"></app-icon>
      </button><app-icon class="ingredient-icon" [name]="iconFor(i)"></app-icon><span>{{ i }}</span
      ><button class="remove" (click)="pantry.removeShopping(i)" [attr.aria-label]="'Remover ' + i">
        <app-icon name="close"></app-icon>
      </button>
    </div>
  } @empty {
    <p class="empty">
      Lista vazia. Veja receitas em
      <a routerLink="/receitas">Falta pouco</a>.
    </p>
  }
</div>
